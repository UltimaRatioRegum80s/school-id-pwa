openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: School ID App API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: students
    description: Student management
  - name: scan
    description: Scan events
  - name: dashboard
    description: Live dashboard
  - name: activities
    description: Activities management
  - name: behavior
    description: Behavior logging
  - name: settings
    description: School settings
  - name: branding
    description: School branding (logo and colour palette)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/register-school:
    post:
      operationId: registerSchool
      tags: [auth]
      summary: Register a new school and admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSchoolBody"
      responses:
        "201":
          description: School and admin created, token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: Slug, code, or username already taken

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: grade
          in: query
          schema:
            type: string
        - name: className
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of students with current state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentWithState"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/print:
    get:
      operationId: getStudentsForPrint
      tags: [students]
      summary: Get students with branding for ID card printing
      parameters:
        - name: grade
          in: query
          schema:
            type: string
          description: Filter by grade (e.g. "8", "10")
        - name: className
          in: query
          schema:
            type: string
          description: Filter by class name (e.g. "10A")
      responses:
        "200":
          description: Students and branding for ID card printing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintCardsResponse"
        "401":
          description: Unauthorized

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student with full profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student with state and today's timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/ids:
    get:
      operationId: listStudentIds
      tags: [students]
      summary: List raw student IDs for the school (lightweight, for duplicate checking)
      responses:
        "200":
          description: Array of student ID strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /students/import:
    post:
      operationId: importStudents
      tags: [students]
      summary: Bulk import students from parsed rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStudentsBody"
      responses:
        "200":
          description: Import result with success/failure breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStudentsResult"

  /students/lookup/{qrCode}:
    get:
      operationId: lookupStudentByQr
      tags: [students]
      summary: Lookup a student by QR code or student ID
      parameters:
        - name: qrCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student with current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWithState"
        "404":
          description: Not found

  /students/{id}/qr-codes:
    get:
      operationId: listStudentQrCodes
      tags: [students]
      summary: List QR code history for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of QR codes for the student
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentQrCode"
        "404":
          description: Not found

  /students/{id}/qr-codes/regenerate:
    post:
      operationId: regenerateStudentQrCode
      tags: [students]
      summary: Regenerate a student's QR code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New active QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQrCode"
        "404":
          description: Not found

  /scan:
    post:
      operationId: processScan
      tags: [scan]
      summary: Process a scan event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanBody"
      responses:
        "200":
          description: Scan processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "404":
          description: Student not found

  /scan/events:
    get:
      operationId: listScanEvents
      tags: [scan]
      summary: List scan events
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of scan events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanEvent"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get live dashboard summary
      parameters:
        - name: grade
          in: query
          schema:
            type: string
          description: Filter by grade (e.g. "8", "9", "10", "11", "12")
        - name: className
          in: query
          schema:
            type: string
          description: Filter by class name (e.g. "8A", "10B")
      responses:
        "200":
          description: Dashboard summary with KPIs, exceptions, and feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Get attendance trends over a date range
      parameters:
        - name: days
          in: query
          schema:
            type: integer
          description: Number of days to include (1-90, default 7)
        - name: grade
          in: query
          schema:
            type: string
          description: Filter by grade
        - name: className
          in: query
          schema:
            type: string
          description: Filter by class name
      responses:
        "200":
          description: Per-day attendance trend points (oldest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardTrendPoint"

  /dashboard/feed:
    get:
      operationId: getDashboardFeed
      tags: [dashboard]
      summary: Get live activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Live activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities
      parameters:
        - name: activityType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityWithCounts"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityBody"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/{id}:
    get:
      operationId: getActivity
      tags: [activities]
      summary: Get activity detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity with attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        "404":
          description: Not found
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityBody"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /activities/{id}/attendance:
    get:
      operationId: getActivityAttendance
      tags: [activities]
      summary: Get attendance for an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: markActivityAttendance
      tags: [activities]
      summary: Mark or update attendance for a student in an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAttendanceBody"
      responses:
        "200":
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "201":
          description: Attendance marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /activities/{id}/attendance/{attendanceId}:
    patch:
      operationId: updateActivityAttendance
      tags: [activities]
      summary: Update an existing attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceBody"
      responses:
        "200":
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /behavior/logs:
    get:
      operationId: listBehaviorLogs
      tags: [behavior]
      summary: List behavior logs
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of behavior logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BehaviorLog"
    post:
      operationId: createBehaviorLog
      tags: [behavior]
      summary: Log a behavior event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBehaviorLogBody"
      responses:
        "201":
          description: Behavior logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorLog"

  /behavior/logs/{id}:
    patch:
      operationId: updateBehaviorLog
      tags: [behavior]
      summary: Update a behavior log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBehaviorLogBody"
      responses:
        "200":
          description: Behavior log updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorLog"
    delete:
      operationId: deleteBehaviorLog
      tags: [behavior]
      summary: Delete a behavior log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /behavior/categories:
    get:
      operationId: listBehaviorCategories
      tags: [behavior]
      summary: List behavior categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BehaviorCategory"
    post:
      operationId: createBehaviorCategory
      tags: [behavior]
      summary: Create a behavior category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBehaviorCategoryBody"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorCategory"

  /behavior/recognition-tiers:
    get:
      operationId: listRecognitionTiers
      tags: [behavior]
      summary: List recognition tiers
      responses:
        "200":
          description: List of recognition tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecognitionTier"
    post:
      operationId: createRecognitionTier
      tags: [behavior]
      summary: Create a recognition tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecognitionTierBody"
      responses:
        "201":
          description: Recognition tier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionTier"

  /behavior/recognition-tiers/{id}:
    patch:
      operationId: updateRecognitionTier
      tags: [behavior]
      summary: Update a recognition tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecognitionTierBody"
      responses:
        "200":
          description: Recognition tier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionTier"
    delete:
      operationId: deleteRecognitionTier
      tags: [behavior]
      summary: Delete a recognition tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /behavior/recognition:
    get:
      operationId: listRecognitionQualifiers
      tags: [behavior]
      summary: List students who have crossed recognition tiers
      responses:
        "200":
          description: Students grouped by the highest recognition tier they qualify for
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecognitionQualifier"

  /behavior/recognition/award:
    post:
      operationId: awardRecognition
      tags: [behavior]
      summary: Mark a recognition tier as actioned for a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardRecognitionBody"
      responses:
        "200":
          description: Recognition award recorded (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionAward"

  /behavior/recognition/award/{id}:
    delete:
      operationId: removeRecognitionAward
      tags: [behavior]
      summary: Undo a recognition action (mark as not yet actioned)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Award removed

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get school settings
      responses:
        "200":
          description: School settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update school settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolSettings"

  /school/branding:
    get:
      operationId: getSchoolBranding
      tags: [branding]
      summary: Get school branding
      responses:
        "200":
          description: School branding info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolBranding"
        "401":
          description: Unauthorized
    put:
      operationId: updateSchoolBranding
      tags: [branding]
      summary: Update school branding (logo and/or palette)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchoolBrandingBody"
      responses:
        "200":
          description: Branding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolBranding"
        "400":
          description: Invalid palette name
        "401":
          description: Unauthorized

  /school/branding/logo:
    post:
      operationId: uploadSchoolLogo
      tags: [branding]
      summary: Upload or replace the school logo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "401":
          description: Unauthorized

  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List staff/admin users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
    post:
      operationId: createUser
      tags: [auth]
      summary: Create a staff/admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        isActive:
          type: string
        schoolId:
          type: integer
        createdAt:
          type: string
        mustChangePassword:
          type: boolean
      required:
        - id
        - username
        - firstName
        - lastName
        - role
        - isActive
        - schoolId
        - createdAt

    RegisterSchoolBody:
      type: object
      properties:
        schoolName:
          type: string
        schoolSlug:
          type: string
        schoolCode:
          type: string
        adminUsername:
          type: string
        adminPassword:
          type: string
        adminFirstName:
          type: string
        adminLastName:
          type: string
        contactEmail:
          type: string
      required:
        - schoolName
        - schoolSlug
        - schoolCode
        - adminUsername
        - adminPassword
        - adminFirstName
        - adminLastName

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
      required:
        - username
        - password
        - firstName
        - lastName
        - role

    StudentQrCode:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        code:
          type: string
        isActive:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - studentId
        - code
        - isActive
        - createdAt

    Student:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        grade:
          type: string
        className:
          type: string
        photoUrl:
          type: ["string", "null"]
        qrCode:
          type: string
        isActive:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - studentId
        - firstName
        - lastName
        - grade
        - className
        - qrCode
        - isActive
        - createdAt
        - updatedAt

    StudentWithState:
      allOf:
        - $ref: "#/components/schemas/Student"
        - type: object
          properties:
            currentState:
              type: string
            lastSeenAt:
              type: ["string", "null"]
            lastSeenLocation:
              type: ["string", "null"]
          required:
